name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce public tracker boundary
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ([string] $env:PULL_REQUEST_BODY -match '(?i)https://dev\.azure\.com/') {
            throw 'Public pull-request bodies cannot contain private Azure DevOps URLs.'
          }
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # Mermaid generation reuses Playwright; Puppeteer's separate browser is unused.
          PUPPETEER_SKIP_DOWNLOAD: "true"
      # Playwright's headless Chromium launch uses the smaller headless shell.
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run check
