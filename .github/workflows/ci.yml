name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Enforce public tracker boundary
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ([string] $env:PULL_REQUEST_BODY -match '(?i)https://dev\.azure\.com/') {
            throw 'Public pull-request bodies cannot contain private Azure DevOps URLs.'
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm install
        env:
          # Mermaid generation reuses Playwright; Puppeteer's separate browser is unused.
          PUPPETEER_SKIP_DOWNLOAD: "true"
      # Playwright's headless Chromium launch uses the smaller headless shell.
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run check
